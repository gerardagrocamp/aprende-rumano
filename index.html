["La hora","🕐",0,"Se dice Este ora... para la hora en punto.","Ce oră este?|¿Qué hora es?;Este ora trei.|Son las tres.;Este ora cinci și jumătate.|Son las cinco y media.;Este ora șase fără zece.|Son las seis menos diez.;Este prânz.|Es mediodía.;Este miezul nopții.|Es medianoche.;La ce oră?|¿A qué hora?;Peste o oră.|Dentro de una hora."],
["Verbos comunes en presente","🏃",0,"Las terminaciones cambian según la persona.","eu merg, tu mergi|yo voy, tú vas;el merge, noi mergem|él va, nosotros vamos;eu vorbesc, tu vorbești|yo hablo, tú hablas;el vorbește, noi vorbim|él habla, nosotros hablamos;eu vreau, tu vrei|yo quiero, tú quieres;el vrea, noi vrem|él quiere, nosotros queremos;eu pot, tu poți|yo puedo, tú puedes;eu fac, tu faci|yo hago, tú haces"],
["Pasado y futuro","⏳",0,"Pasado: am + participio (am mâncat). Futuro: voi + infinitivo (voi merge).","Am mâncat.|He comido.;Am vorbit cu Ana.|He hablado con Ana.;Ai văzut filmul?|¿Has visto la película?;Ieri am citit o carte.|Ayer leí un libro.;Nu am înțeles.|No he entendido.;Voi merge mâine.|Iré mañana.;Vom mânca împreună.|Comeremos juntos.;Vei veni la petrecere?|¿Vendrás a la fiesta?"]
].map(([n,i,g,t,c])=>({n,i,g,t,c:c.split(';').map(x=>x.split('|'))}));
const EL=[999,8,45,50,55,60,15,40,25,20,35,65,70,80,85,18,22,42,28,32,38,58,62,52,75];
const $=s=>document.querySelector(s),app=$('#app');
let st={best:{},name:''};try{st=Object.assign(st,JSON.parse(localStorage.getItem('rg')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rg',JSON.stringify(st))}catch(e){}};
const sh=a=>[...a].sort(()=>Math.random()-.5),blk=l=>Math.floor((l-1)*12/100),bs=l=>st.best[l]||0;
const unl=l=>l==1||bs(l-1)>=8;
const ic=s=>s>=10?'😄🏆':s>=9?'😁⭐':s>=8?'🙂👍':s>=6?'😐':s>=4?'😕':s>0?'😟':'😡';
const lvOf=b=>{const a=[];for(let l=1;l<=100;l++)if(blk(l)==b)a.push(l);return a};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ro-RO';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ro'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const hdr=(t,f)=>`<div class="top"><button class="bk" onclick="${f||'home()'}">←</button><b>${t}</b></div>`;
function home(){const d=Object.values(st.best).filter(x=>x>=8).length;app.innerHTML=`<div class="hero"><div class="flag"></div><h1>Aprende Rumano con Gerard</h1><p class="mu">🇷🇴 100 niveles · 20 ejercicios por nivel · aprueba con un 8<br>Niveles superados: <b>${d}/100</b></p></div><div class="menu"><button onclick="levels()">🎯 Niveles</button><button onclick="study()">📖 Modo estudio</button><button onclick="grades()">📊 Mis calificaciones</button><button onclick="diploma()">🎓 Diploma</button></div><p class="mu">🔊 El audio usa la voz rumana de tu navegador/dispositivo.</p>`}
function levels(){let h=hdr('Niveles');B.forEach((b,i)=>{h+=`<h2>${b.i} ${i+1}. ${b.n}</h2><div class="grid">`+lvOf(i).map(l=>`<button class="lv ${bs(l)>=8?'d':''}" ${unl(l)?'':'disabled'} onclick="start(${l})">${unl(l)?l:'🔒'}<small>${bs(l)?ic(bs(l)).slice(0,2)+bs(l):unl(l)?'nuevo':''}</small></button>`).join('')+'</div>'});app.innerHTML=h}
function study(){let h=hdr('Modo estudio')+'<p class="mu">Aprende sin ejercicios. Toca una tarjeta para escucharla.</p><h2>🧭 Lo esencial del idioma</h2><div class="menu">'+E.map((e,i)=>`<button onclick="studyE(${i})">${e.i} ${e.n}</button>`).join('')+'</div><h2>📚 Vocabulario por temas</h2><div class="menu">';B.forEach((b,i)=>h+=`<button onclick="studyB(${i})">${b.i} ${b.n} <span class="mu">· ${b.w.length} palabras</span></button>`);app.innerHTML=h+'</div>'}
function studyB(i){const b=B[i];let h=hdr(b.i+' '+b.n,'study()')+`<div class="wc">`+b.w.map((w,j)=>`<div class="w" onclick="say(B[${i}].w[${j}].r)"><div class="e">${w.m}</div><b>${w.r}</b><span class="mu">${w.e}</span><div>🔊</div></div>`).join('')+'</div>';const f=P.filter(p=>p[3]==i);if(f.length)h+='<h2>Frases</h2>'+f.map(p=>`<div class="row" onclick="say('${p[0].replace(/'/g,"")}')"><b>${p[0]}</b> 🔊<br><span class="mu">${p[1]}</span></div>`).join('');h+=`<a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent('rumano para hispanohablantes '+b.n)}">▶️ Ver vídeos sobre este tema</a><br><button class="big-btn p" onclick="start(${lvOf(i)[0]})">🎯 Practicar este bloque</button>`;app.innerHTML=h}
function studyE(i){const e=E[i];let h=hdr(e.i+' '+e.n,'study()');if(e.t)h+=`<div class="card">💡 ${e.t}</div>`;h+=e.g?'<div class="wc">'+e.c.map((c,j)=>`<div class="w" onclick="say(E[${i}].c[${j}][3]||E[${i}].c[${j}][0])"><div class="e">${c[2]||''}</div><b>${c[0]}</b><span class="mu">${c[1]}</span><div>🔊</div></div>`).join('')+'</div>':e.c.map((c,j)=>`<div class="row" onclick="say(E[${i}].c[${j}][0])"><b>${c[0]}</b> 🔊<br><span class="mu">${c[1]}</span></div>`).join('');h+=`<br><a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent('rumano para hispanohablantes '+e.n)}">▶️ Ver vídeos sobre este tema</a>`;app.innerHTML=h}
function grades(){let h=hdr('Mis calificaciones');B.forEach((b,i)=>{const L=lvOf(i),d=L.filter(l=>bs(l)>=8).length,pl=L.filter(l=>bs(l)),avg=pl.length?pl.reduce((a,l)=>a+bs(l),0)/pl.length:0;h+=`<div class="row"><div class="flex"><b>${b.i} ${b.n}</b><span style="font-size:1.5rem">${pl.length?ic(Math.round(avg)):'—'}</span></div><span class="mu">Niveles ${L[0]}–${L[L.length-1]} · superados ${d}/${L.length} · media ${avg.toFixed(1)}/10</span><div class="bar"><i style="width:${d/L.length*100}%"></i></div></div>`});app.innerHTML=h}
function diploma(){const all=Array.from({length:100},(_,i)=>bs(i+1)>=8).every(Boolean),d=Object.values(st.best).filter(x=>x>=8).length;if(!all){app.innerHTML=hdr('Diploma')+`<div class="card"><div class="big">🔒🎓</div><p>Supera los 100 niveles para conseguir tu diploma.</p><p><b>${d}/100</b></p></div>`;return}
app.innerHTML=hdr('Diploma')+`<div class="dip"><div style="font-size:3rem">🎓🇷🇴</div><p>Aprende Rumano con Gerard certifica que</p><input id="nm" placeholder="Tu nombre" value="${st.name}" oninput="st.name=this.value;save()"><p>ha completado con éxito el curso de lengua rumana: 100 niveles superados.</p><p><b>${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</b></p><div style="font-size:2rem">🏆</div><p><i>Felicitări! ¡Felicidades!</i></p></div><button class="big-btn p noprint" onclick="try{print()}catch(e){}">🖨️ Imprimir / guardar PDF</button>`}
let S;
function build(l){const b=blk(l),t=(l-1)*12/100-b,pool=B[b].w,prev=B.slice(0,b).flatMap(x=>x.w),ph=P.filter(p=>p[3]<=b);let bag=[];const ep=E.flatMap((e,k)=>l>=EL[k]?e.c.map(c=>({r:c[0],e:c[1],k,m:e.g?c[2]:''})):[]),ephr=ep.filter(x=>x.r.includes(' ')&&!/[,\/→(]/.test(x.r+x.e)).map(x=>[x.r,x.e,x.r.replace(/[?!.,]/g,'').split(' ').sort((u,v)=>v.length-u.length)[0]]);
const nw=()=>{if(prev.length&&Math.random()<t*.5)return sh(prev)[0];if(!bag.length)bag=sh(pool);return bag.pop()};
const ds=(w)=>sh(pool.concat(t>.4?prev:[]).filter(x=>x.e!=w.e&&x.r!=w.r)).slice(0,3);
const r=Math.round,tr=2+r(4*t),fi=3+r(2*t),es=3+r(2*t),li=3,ne=ep.length>3?Math.min(8,r(Math.max(0,l-5)/8)):0,rq=20-tr-fi-es-li-ne,q=[];
for(let i=0;i<rq;i++){const w=nw();q.push({p:'¿Qué significa?',big:w.r,m:w.m,say:w.r,o:sh([w.e,...ds(w).map(x=>x.e)]),a:w.e})}
for(let i=0;i<es;i++){const w=nw();q.push({p:'¿Cómo se dice en rumano?',big:w.e,m:w.m,say:w.r,late:1,o:sh([w.r,...ds(w).map(x=>x.r)]),a:w.r})}
for(let i=0;i<li;i++){const w=nw();q.push({p:'Escucha y elige el significado',big:'🎧',say:w.r,auto:1,o:sh([w.e,...ds(w).map(x=>x.e)]),a:w.e})}
for(let i=0;i<fi;i++){const p=sh(ph.concat(ephr))[0],wr=sh([...new Set(P.map(x=>x[2]))].filter(x=>x!=p[2])).slice(0,3);q.push({p:'Completa la frase',big:p[0].replace(p[2],'_____'),sub:p[1],say:p[0],late:1,o:sh([p[2],...wr]),a:p[2]})}
for(let i=0;i<tr;i++){const p=sh(ph.concat(ephr))[0],tk=p[1].split(' '),ex=sh([...new Set(P.flatMap(x=>x[1].split(' ')))].filter(x=>!tk.includes(x))).slice(0,3);q.push({k:'t',p:'Traduce al español',big:p[0],say:p[0],bank:sh([...tk,...ex]),a:tk})}
for(let i=0;i<ne;i++){const w=sh(ep)[0],sc=ep.filter(x=>x.k==w.k&&x.e!=w.e&&x.r!=w.r),d=sh(sc.length>=3?sc:ep.filter(x=>x.e!=w.e&&x.r!=w.r)).slice(0,3);
if(i%2)q.push({p:'¿Cómo se dice en rumano?',big:w.e,m:w.m,say:w.r,late:1,o:sh([w.r,...d.map(x=>x.r)]),a:w.r});else q.push({p:'¿Qué significa?',big:w.r,m:w.m,say:w.r,o:sh([w.e,...d.map(x=>x.e)]),a:w.e})}
return sh(q)}
function askName(l){app.innerHTML=hdr('¡Bienvenido!','levels()')+`<div class="card"><div class="big">👋</div><p>¿Cómo te llamas? Tu nombre saldrá en tu diploma.</p><input id="nm0" class="in" placeholder="Tu nombre" maxlength="40"></div><button class="big-btn p" onclick="setN(${l})">Empezar</button>`}
function setN(l){const v=$('#nm0').value.trim();if(!v){$('#nm0').focus();return}st.name=v;save();start(l)}
function start(l){if(!st.name){askName(l);return}S={l,q:build(l),i:0,c:0};ask()}
function ask(){const x=S.q[S.i];S.ans=false;S.bu=[];
app.innerHTML=`<div class="top"><button class="bk" onclick="levels()">✕</button><div class="bar"><i style="width:${S.i*5}%"></i></div><b>${S.i+1}/20</b></div><div class="card"><div class="pr">Nivel ${S.l} · ${x.p}</div><div class="big">${x.m||''} ${x.big}</div>${x.sub?`<div class="mu">${x.sub}</div>`:''}<button class="snd" id="sn" onclick="say(S.q[S.i].say)" ${x.late?'style="display:none"':''}>🔊 Escuchar</button></div>`+(x.k?`<div class="ans" id="an"></div><div id="bk"></div><div class="fb" id="fb"></div><button class="big-btn p" id="ck" onclick="chk()">Comprobar</button>`:x.o.map((o,i)=>`<button class="o" onclick="pk(${i})">${o}</button>`).join('')+`<div class="fb" id="fb"></div>`)+`<div id="nx"></div>`;
if(x.k)dT();if(x.auto)say(x.say)}
function dT(){const x=S.q[S.i];$('#an').innerHTML=S.bu.map((b,j)=>`<button class="tk" onclick="un(${j})">${x.bank[b]}</button>`).join('');$('#bk').innerHTML=x.bank.map((w,i)=>`<button class="tk" ${S.bu.includes(i)?'disabled':''} onclick="ad(${i})">${w}</button>`).join('')}
function ad(i){if(S.ans)return;S.bu.push(i);dT()}function un(j){if(S.ans)return;S.bu.splice(j,1);dT()}
function fin(ok,msg){S.ans=true;if(ok)S.c++;const x=S.q[S.i],f=$('#fb');f.className='fb '+(ok?'ok':'ko');f.textContent=(ok?'✅ ¡Correcto! ':'❌ ')+msg;$('#sn').style.display='';say(x.say);$('#nx').innerHTML=`<button class="big-btn p" onclick="nx()">${S.i==19?'Ver resultado':'Siguiente'}</button>`}
function pk(i){if(S.ans)return;const x=S.q[S.i],bt=document.querySelectorAll('.o');bt.forEach((b,j)=>{if(x.o[j]==x.a)b.classList.add('ok')});const ok=x.o[i]==x.a;if(!ok)bt[i].classList.add('ko');fin(ok,ok?'':'Respuesta: '+x.a)}
function chk(){if(S.ans)return;const x=S.q[S.i],g=S.bu.map(i=>x.bank[i]).join(' ');$('#ck').style.display='none';fin(g==x.a.join(' '),g==x.a.join(' ')?'':'Correcto: '+x.a.join(' '))}
function nx(){S.i++;S.i>=20?res():ask()}
function res(){const s=S.c/2,pass=s>=8;if(s>bs(S.l)){st.best[S.l]=s;save()}
app.innerHTML=`<div class="res"><div class="em">${ic(s)}</div><div class="sc">${s}/10</div><p>${S.c} aciertos de 20</p><p><b>${pass?'¡Nivel superado! 🎉':'Necesitas 8 o más para pasar. ¡Inténtalo otra vez!'}</b></p></div><div class="menu">${pass&&S.l<100?`<button class="big-btn p" onclick="start(${S.l+1})">Siguiente nivel →</button>`:''}${pass&&S.l==100?`<button class="big-btn p" onclick="diploma()">🎓 ¡Ver mi diploma!</button>`:''}<button onclick="start(${S.l})">🔁 Repetir nivel</button><button onclick="levels()">🎯 Niveles</button><button onclick="home()">🏠 Menú</button></div>`}
home();
</script><script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js')}catch(e){}})}</script></body></html>
